sources:
- title: Uber das Gravitationsfeld eines Massenpunktes nach der Einsteinschen Theorie
  authors:
  - Karl Schwarzschild
  location: Sitzungsberichte der Koniglich Preussischen Akademie der Wissenschaften (Berlin), 1916,
    pp. 189-196
  type: paper
  relationship: independently-proves
  note: 'The paper in which the metric of Part III was introduced, and the source of the result that
    it solves the vacuum field equations. WHAT IS COMPARED FROM IT: that the metric diag(-(1 - 2M/r),
    (1 - 2M/r)^{-1}, r^2, r^2 sin^2 theta) has vanishing Ricci tensor, vanishing Einstein tensor and
    vanishing scalar curvature on the exterior chart. The Lean proof is a direct component computation
    and is not a translation of Schwarzschild''s derivation, which is why the relationship is recorded
    as independently-proves rather than formalizes. BIBLIOGRAPHIC NOTE, checked for this entry: the
    1916 Sitzungsberichte article has NO DOI and NO record in either Crossref or OpenAlex (an OpenAlex
    title search over 1900-1930 returns count 0). Three confirmable surrogates exist and were verified:
    the 1992 Springer reprint in the Collected Works, pp. 449-456, doi:10.1007/978-3-642-58084-0_21;
    the 2003 General Relativity and Gravitation Golden Oldie republication, 35(5), 951-959, doi:10.1023/A:1022971926521;
    and the English translation deposited as arXiv:physics/9905030 (OpenAlex W1616233161), whose record
    independently carries volume 1916 and pages 189-196. The editorial note accompanying the Golden
    Oldie (Antoci and Liebscher, GRG 35(5), 945-950, doi:10.1023/A:1022919909683) is a separate item
    and is NOT cited here as the primary source. The German title above is written out by hand rather
    than copied from an API record, because the API records mangle the umlaut.'
  author_endorsement: not-contacted
- title: Uber die Eigengravitation des elektrischen Feldes nach der Einsteinschen Theorie
  authors:
  - Hans Reissner
  id: https://doi.org/10.1002/andp.19163550905
  location: Annalen der Physik 355 (1916), no. 9, 106-120
  type: paper
  relationship: independently-proves
  note: 'The first of the two papers behind the metric of Part VI: the charged spherically symmetric
    solution, obtained here for a point charge. WHAT IS COMPARED: that the metric with lapse f = 1
    - 2M/r + Q^2/r^2 satisfies G_{mu nu} = 8 pi T_{mu nu} for the Maxwell stress tensor of the Coulomb
    field, together with R = 0 and R_{theta theta} = Q^2/r^2. The Lean proof is a direct component
    computation, not a translation. Bibliographic data verified against Crossref for this entry: author
    recorded as ''H. Reissner'', Annalen der Physik, volume 355, ISSUE 9, pages 106-120, published-print
    1916, ISSN 0003-3804 and 1521-3889. FLAG: the issue is recorded as 9, not the ''50'' that appears
    in the common citation form ''Ann. Phys. 355 (50), 106-120'' -- that 50 is the Band number of
    the series, not the issue. The German title is written out by hand. NOT CLAIMED: Maxwell''s equations,
    which this paper of course treats and which are neither stated nor used anywhere in this entry.'
  author_endorsement: not-contacted

status:
  scope: 'PROVED: the twenty-one compared theorems, unconditionally, under exactly the hypotheses
    shown in their statements. Schwarzschild: Ricci-flatness, vanishing Einstein tensor and vanishing
    scalar curvature at every point of {r > 0, r > 2M, sin(theta) != 0}, for every real M. General
    chart-level metrics: the equivalence of the two forms of the vacuum equations where the metric
    is symmetric and its determinant a unit, in every dimension n != 2. Schwarzschild-de Sitter: R_{mu
    nu} = Lambda g_{mu nu} where r != 0, sin(theta) != 0 and the lapse and radius are nonzero on a
    neighbourhood of r. Uniqueness: on any open interval avoiding r = 0, every differentiable lapse
    with 1 - f - r f'' = 0 throughout equals 1 - 2M/r for one constant M. Reissner-Nordstrom: R_{theta
    theta} = Q^2/r^2, R = 0, F_{ab}F^{ab} = -2Q^2/r^4, and G_{mu nu} = 8 pi T_{mu nu} in all sixteen
    components on {r > 0, f != 0, sin(theta) != 0}, for the Maxwell stress tensor of the Coulomb field
    as defined in the Challenge. Vaidya: R_{mu nu} = (2m''(v)/r^2) delta^v_mu delta^v_nu, R = 0, and
    the Einstein-tensor form, wherever r is nonzero near r, sin(theta) != 0, and m has a derivative
    m_1 near v -- FIRST derivative only. Flat FLRW: G_tt = 3(adot/a)^2, G_ii = -(2 a addot + adot^2)
    for each spatial i, and G_{bd} = 0 for b != d, wherever a is nonzero and twice differentiable
    near t. Static de Sitter: R_{mu nu} = (3/L^2) g_{mu nu} and R = 12/L^2 on {r > 0, f != 0, sin(theta)
    != 0} for L != 0. Minkowski in spherical coordinates: Ricci-flat wherever r != 0 and sin(theta)
    != 0. Kiselev: R_{theta theta} = -3wc r^{-(3w+1)} and, at w = 0, Ricci-flatness, on r > 0 with
    the lapse nonzero near r.


    NOT PROVED and NOT CLAIMED: any manifold-level, atlas-level or coordinate-independent statement;
    any tensoriality or transformation law; any global or maximal extension of any chart, and anything
    at all at a horizon, at r <= 0, or at sin(theta) = 0; Birkhoff''s theorem itself (staticity is
    assumed, not derived); the symmetry of the Ricci tensor in general (Clairaut for the coordinate
    partial derivative is missing from the library and no symmetry lemma is compared -- symmetry is
    exhibited componentwise instead); the first and second Bianchi identities; Maxwell''s equations
    in any form; any matter model, fluid, or energy condition (the only stress-energy tensor defined
    anywhere is the Maxwell one of Part VI); non-flat FLRW; the outgoing Vaidya chart; the Kiselev
    degenerations at w = 1/3 and w = -1 (recorded in prose, not compared); the Kretschmann scalar
    or any curvature invariant beyond the scalar curvature; any geodesic, causal-structure, horizon
    or singularity-theorem statement; and every other result in the supporting library that is not
    named in comparator.json.


    This entry is a proof of concept for the definitional layer, not a claim of new mathematics. The
    compared results are classical.'

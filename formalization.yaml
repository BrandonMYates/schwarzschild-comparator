status:
  scope: 'PROVED: the twenty-one compared theorems, unconditionally, under exactly the hypotheses
    shown: chart-local, on the stated open regions, Vaidya needing only a C^1 mass function. NOT PROVED
    and NOT CLAIMED: any manifold-level or coordinate-independent claim; any maximal extension; anything
    at a horizon or pole; Birkhoff''s theorem itself (staticity is assumed); Ricci symmetry in general
    or the Bianchi identities; Maxwell''s equations; any matter model, fluid or energy condition beyond
    the defined Maxwell tensor; non-flat FLRW; the outgoing Vaidya chart; every library result not
    in comparator.json.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - claude-opus-5
    - claude-fable-5
    framework: Claude Code
    tool_setup: The library was produced by a lead agent (claude-opus-5) coordinating workers against
      frozen lemma contracts under the author's direction. Every statement was fixed before any Lean
      proof by two independent symbolic engines that had to agree -- a standalone sympy re-implementation
      and the author's computer-algebra suite -- with zero mismatches on each metric; the 304-entry
      Vaidya tables were additionally diffed against the oracle by parsing the Lean array literals
      back out of the source.
    cost:
      wall_time: Two waves in a single session on 2026-08-27; total campaign wall-clock not recorded.
      spend_usd: subscription-based
      hardware: local Apple Silicon machine
    prompting_notes: 'Three findings. (1) Mathlib''s ring does NOT fail when it cannot close a goal
      -- it falls back to ring_nf and succeeds -- so first | ring | ... commits to a branch leaving
      the goal open; ring1 is required, and a bare rw and exact carry the same hazard, exact by postponing
      metavariables. (2) A t1 <;> t2 chain shares one heartbeat budget across every goal: sixteen
      Ricci components timed out at maxHeartbeats 2000000 in one chain and elaborate in under 15 s
      as sixteen declarations at the default. (3) sympy.simplify failed to reduce a Riemann component
      of FLAT space to zero, so the cross-check has a false-positive mode and a stray nonzero component
      must be re-simplified before it is believed.'
  spend_usd: subscription-based
  notes: 'Roles, stated separately. Direction: the author set the target statements and their scope,
    chose what to certify and what to leave out, supplied the validation-gated computer-algebra suite
    used as one of the two oracles, and takes responsibility for the submission. Mathematical argument:
    classical, with no step originating here. The Lean proof architecture and the computations were
    developed by AI agents (Claude Code, claude-opus-5) under the author''s direction, including the
    row-plus-trace split that keeps the Vaidya theorem C^1 and the machine-closed 304-entry table
    diff, both agent findings. Formalization: the same agents. Verification: mechanical, plus an independent
    pass by a separate agent (claude-fable-5). Communication: drafted by agents, reviewed by the author.'
fidelity:
  divergences: 'Chart-only: a metric is a matrix-valued function on an open set in R^4; with no atlas,
    no manifold and no coordinate-independence theorem, so nothing is invariant. Signature (-,+,+,+),
    Wald/Carroll convention: de Sitter has POSITIVE scalar curvature; the opposite sign is also current.
    Coordinate order differs by Part: Vaidya (v,r,theta,phi), FLRW comoving. Vaidya is INGOING with
    g_vr = +1 and needs m only C^1; FLRW is k = 0; Kiselev uses Real.rpow on r > 0. Vacuum means R_uv
    = 0 (III, V, X, w=0 of XI), R_uv = Lambda g_uv (IV, IX), or G = 8 pi T for the one defined Maxwell
    tensor (VI); VII and VIII define none. A library docstring calls the flat spherical chart eleven-symbol;
    it is nine.'
review:
  status: agent-reviewed
  reviewers:
  - Claude Code agents (clean rebuild, axiom audit over all 54 compared declarations, source-level
    signature diff, sorry scan, Crossref/OpenAlex verification of every source)
  notes: Rebuilt from scratch against Mathlib v4.32.0 (8,673 jobs, clean). The Challenge produces
    exactly 21 sorry warnings, one per compared theorem, and nothing else; the Solution builds clean.
    All 54 compared declarations report exactly propext, Classical.choice and Quot.sound, and a source
    diff found all 54 signatures identical across library, Solution and Challenge. Only the author
    has reviewed it.
alignment:
  namespace: SchwarzschildVacuum
  statements:
  - source: Standard textbook general relativity (Wald 1984 ch. 3; Carroll 2019 ch. 3)
    lean: SchwarzschildVacuum.einstein_eq_zero_iff_ricciFlat
    status: proved
    note: G = 0 iff Ricci = 0 for a symmetric metric of unit determinant, n != 2. That hypothesis
      is carried, not decorative.
  - source: Schwarzschild 1916
    lean: SchwarzschildVacuum.schwarzschild_ricciFlat
    status: proved
    note: Every Ricci component vanishes on {r > 0, r > 2M, sin(theta) != 0}. Nothing is claimed at
      the horizon or beyond.
  - source: Schwarzschild 1916, in Einstein-tensor form
    lean: SchwarzschildVacuum.schwarzschild_einstein_eq_zero
    status: proved
    note: G = 0 on the same chart, obtained from Ricci-flatness via the compared n != 2 equivalence,
      not by a second computation.
  - source: Schwarzschild 1916; immediate from Ricci-flatness
    lean: SchwarzschildVacuum.schwarzschild_scalarCurvature_eq_zero
    status: proved
    note: 'R = 0 on the exterior chart. NOT a flatness statement: the Kretschmann scalar is 48M^2/r^6
      and is not formalized.'
  - source: Kottler 1918
    lean: SchwarzschildVacuum.ricci_sds
    status: proved
    note: R_uv = Lambda g_uv for lapse 1 - 2M/r - Lambda r^2/3. The neighbourhood hypotheses are what
      differentiation needs.
  - source: Jebsen 1921 and Birkhoff 1923, RESTRICTED to the areal static spherically symmetric gauge
    lean: SchwarzschildVacuum.exists_mass_of_areal_vacuum
    status: proved
    note: 'On an interval avoiding r = 0, 1 - f - r f1 = 0 forces f = 1 - 2M/r. Weaker than the theorem:
      staticity is assumed.'
  - source: Reissner 1916 and Nordstrom 1918
    lean: SchwarzschildVacuum.ricci_rn_thetaTheta
    status: proved
    note: R_thetatheta = Q^2/r^2, NONZERO whenever the charge is. The falsifier for the Schwarzschild
      statements.
  - source: Reissner 1916 and Nordstrom 1918; tracelessness of the Maxwell stress tensor in four dimensions
    lean: SchwarzschildVacuum.reissnerNordstrom_scalarCurvature_eq_zero
    status: proved
    note: 'R = 0 for Reissner-Nordstrom. Not a vacuum statement: the Ricci tensor is nonzero and only
      its trace vanishes.'
  - source: Wald 1984 (6.5.2); the invariant of a purely radial electric field
    lean: SchwarzschildVacuum.faradayInvariant_coulomb
    status: proved
    note: F_ab F^ab = -(2Q^2/r^4) for the Coulomb Faraday tensor, both indices raised by the inverse
      metric.
  - source: Reissner 1916 and Nordstrom 1918; stress tensor as in Wald (6.5.4)
    lean: SchwarzschildVacuum.reissnerNordstrom_einstein_eq_maxwell
    status: proved
    note: 'G = 8 pi T in all sixteen components for the DEFINED Maxwell tensor. Einstein half only:
      Maxwell equations are not used.'
  - source: Vaidya 1951; statement in the form of Poisson (2004) eq. (4.35)
    lean: SchwarzschildVacuum.ricci_vaidya_null_dust
    status: proved
    note: R_uv = (2m'(v)/r^2) delta^v_u delta^v_v, ingoing chart, for a once-differentiable mass function.
      No m'' is requested.
  - source: Vaidya 1951; the trace of a null Ricci tensor
    lean: SchwarzschildVacuum.vaidya_scalarCurvature_eq_zero
    status: proved
    note: 'R = 0. Not a cancellation: the only nonvanishing component is R_vv and the ingoing inverse
      metric has g^vv = 0.'
  - source: Vaidya 1951, in Einstein-tensor form
    lean: SchwarzschildVacuum.einstein_vaidya
    status: proved
    note: G equals the same rank-one null table, since R = 0. No stress tensor is defined; "null dust"
      describes the form only.
  - source: Friedmann 1922 and Lemaitre 1927; expression as in Carroll (8.67)
    lean: SchwarzschildVacuum.friedmann_first
    status: proved
    note: 'G_tt = 3(adot/a)^2 for flat FLRW. Einstein-tensor form only: no fluid is defined, so H^2
      = 8 pi rho/3 does not follow.'
  - source: Friedmann 1922 and Lemaitre 1927; expression as in Carroll (8.68)
    lean: SchwarzschildVacuum.friedmann_second
    status: proved
    note: G_ii = -(2 a addot + adot^2) for each spatial i, same hypotheses and caveat. The hypothesis
      i != 0 is carried.
  - source: Friedmann 1922 and Lemaitre 1927; isotropy of the flat FLRW source
    lean: SchwarzschildVacuum.einstein_flrw_offDiag
    status: proved
    note: 'Every off-diagonal component of G vanishes: no momentum flux, no anisotropic stress.'
  - source: de Sitter space in the static patch; standard textbook result
    lean: SchwarzschildVacuum.ricci_deSitterStatic
    status: proved
    note: R_uv = (3/L^2) g_uv on {r > 0, f != 0, sin(theta) != 0}. The cosmological horizon r = L
      is excluded.
  - source: de Sitter space; scalar curvature of a maximally symmetric four-space
    lean: SchwarzschildVacuum.deSitterStatic_scalarCurvature
    status: proved
    note: R = 12/L^2, constant and POSITIVE. The sharpest check that the sign convention is the one
      advertised.
  - source: Elementary; Minkowski space in spherical coordinates
    lean: SchwarzschildVacuum.minkowskiSpherical_ricciFlat
    status: proved
    note: 'Ricci-flat. Compared deliberately: this chart of FLAT space has nine nonzero Christoffel
      entries, testing cancellation.'
  - source: Kiselev 2003
    lean: SchwarzschildVacuum.ricci_kiselev_thetaTheta
    status: proved
    note: R_thetatheta = -(3wc r^-(3w+1)) on r > 0, nonzero whenever w and c are. The exponent is
      a real power (Real.rpow).
  - source: Kiselev 2003; the dust case
    lean: SchwarzschildVacuum.kiselev_ricciFlat_of_w_eq_zero
    status: proved
    note: 'At w = 0 the metric is Ricci-flat: f = 1 - 2M/r - c/r is Schwarzschild with mass M + c/2,
      a pure mass shift.'
acknowledgements: Mathlib and its contributors; the Lean FRO for Lean, Comparator, lean4export and

- title: Uber die allgemeinen kugelsymmetrischen Losungen der Einsteinschen Gravitationsgleichungen
    im Vakuum
  authors:
  - Jorg Tofte Jebsen
  id: https://doi.org/10.1007/s10714-005-0168-y
  location: Arkiv for Matematik, Astronomi och Fysik 15 (1921), no. 18; reprinted in English translation
    as General Relativity and Gravitation 37 (2005), no. 12, 2253-2259
  type: paper
  relationship: independently-proves
  note: 'The earliest statement of what is now called Birkhoff''s theorem, two years before Birkhoff.
    Cited alongside Birkhoff for the uniqueness result of Part V, and named first because it has priority.
    BIBLIOGRAPHIC NOTE, checked for this entry: the 1921 Arkiv original has NO Crossref record and
    only a DOI-less OpenAlex stub (W3025852109) whose primary_location source is null -- the journal
    is not recorded at all -- and whose biblio field gives first_page 18, a mis-parse of ''nr. 18''
    and not a page range. The DOI above is therefore the 2005 GRG English-translation reprint, verified
    against Crossref: J. T. Jebsen, General Relativity and Gravitation, volume 37, issue 12, pages
    2253-2259, issued 2005-11-22. WHAT IS COMPARED, AND THE GAUGE RESTRICTION: only the calculus core
    in the areal-radius static spherically symmetric gauge. Jebsen''s and Birkhoff''s theorem DERIVES
    staticity from the vacuum equations for a general spherically symmetric metric; the compared statement
    ASSUMES it, along with the areal radial coordinate and the reciprocal lapse/radial-metric pair,
    and proves only that under those assumptions the vacuum equation forces f = 1 - 2M/r. That is
    a strictly weaker statement than the source''s and is labelled as such in the Challenge docstring.
    The Norwegian author''s name is written out by hand.'
  author_endorsement: not-contacted
- title: Relativity and Modern Physics
  authors:
  - George David Birkhoff
  id: https://doi.org/10.4159/harvard.9780674734487
  location: Harvard University Press, Cambridge, MA, 1923, xi + 283 pp.
  type: book
  relationship: independently-proves
  note: 'The book in which the uniqueness theorem for spherically symmetric vacuum solutions became
    widely known, and the name under which the result of Part V is normally cited. The gauge restriction
    described in the Jebsen entry applies identically here: what is compared is strictly weaker than
    the theorem, because staticity is assumed rather than derived. BIBLIOGRAPHIC NOTE, checked for
    this entry and flagged deliberately: the Crossref record at the DOI above is stamped 1927, not
    1923, and records Rudolph Ernest Langer as an additional author; OpenAlex (W1966021391) mirrors
    the 1927 date. The 1927 stamp appears to be a Harvard University Press digital-backlist placeholder.
    The 1923 date used here is independently attested inside Crossref by a contemporaneous review,
    L. P. Eisenhart, Science 58 (1923-12-28), 539-541, doi:10.1126/science.58.1513.539, whose recorded
    title reads ''Relativity and Modern Physics. By G. D. Birkhoff, Cambridge, Harvard University
    Press, 1923. xi + 283 pp.'' The year is cited deliberately against the DOI record rather than
    silently taken from it.'
  author_endorsement: not-contacted

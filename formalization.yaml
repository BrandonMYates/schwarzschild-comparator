automation:
  methods:
  - method: agent
    models:
    - claude-opus-5
    - claude-fable-5
    framework: Claude Code
    tool_setup: 'The supporting library (the pinned GRLab repository, seventeen modules and 4,431
      lines) was produced by a lead agent (claude-opus-5) coordinating worker agents (claude-opus-5)
      against frozen lemma contracts, under the author''s direction, on Mathlib v4.32.0. Before any
      Lean proof was attempted, every lemma statement was fixed by two independent symbolic computations
      that had to agree: a roughly ninety-line re-implementation of the five index formulas in sympy,
      importing nothing from the author''s suite, and the author''s own computer-algebra curvature
      engine. Receipts per metric: Reissner-Nordstrom Christoffel 64/64 (13 nonzero), Ricci 16/16
      (4 nonzero), Einstein 16/16, scalar agrees, 0 mismatches; ingoing Vaidya Christoffel 64/64 (15
      nonzero), Ricci 16/16 (1 nonzero), 0 mismatches; flat FLRW compared through the chart-independent
      mixed tensor G^mu_nu, 16/16 agreeing with scalar residual exactly zero; static de Sitter R_{mu
      nu} - (3/L^2) g_{mu nu} = 0 in all sixteen components with R = 12/L^2; Minkowski-spherical Ricci
      16/16 zero and Riemann 256/256 zero. For the largest table (the ingoing Vaidya chart, six tables,
      304 scalar entries) the transcription step was machine-closed as well: a parser reads the Lean
      array literals back out of the .lean source, translates them to sympy and symbolically diffs
      every entry against the oracle, reporting 304 entries compared and 0 mismatches, before the
      proving work was dispatched. Verification (clean rebuild against Mathlib v4.32.0, per-declaration
      #print axioms over all twenty-one compared theorems and all thirty-three compared definitions,
      and a scan of the library for sorry, native_decide and axiom declarations) was performed by
      a separate agent (claude-fable-5), which also wrote the Challenge, the Solution and this metadata.'
    cost:
      wall_time: The supporting library was built on 2026-08-27 in two waves within a single session,
        with concurrent agents; total campaign wall-clock was not recorded. The comparator (Challenge,
        Solution, comparator.json and this metadata) was prepared in the same session, including full
        local builds of the library, the Challenge and the Solution after each wave.
      spend_usd: subscription-based
      hardware: local Apple Silicon machine
    prompting_notes: 'Seven items on record, each a measured finding rather than a recollection. (1)
      Mathlib''s ring tactic does NOT fail when it cannot close the goal: it falls back to ring_nf,
      emits "Try this: [apply] ring_nf" as an info message, and SUCCEEDS as a tactic. A first | ring
      | <fallback> alternation therefore commits to the ring branch and never reaches any later alternative,
      leaving a silently unsolved goal that surfaces only as "unsolved goals" at the theorem header.
      The atomic-failure version ring1 is required. The same hazard has a second form: a bare rw [h]
      succeeds whenever its pattern is present even if the resulting goal is still open, so in an
      alternation every (rw [h]; ring1) pair must precede the corresponding bare rw [h]. Both live
      in the Schwarzschild-de Sitter and Reissner-Nordstrom proofs and cost build cycles there. (2)
      A t1 <;> t2 <;> t3 chain shares ONE heartbeat budget across every goal it produces. Proving
      all sixteen Ricci components in a single fin_cases b <;> fin_cases d <;> ... <;> field_simp
      <;> ring chain timed out at maxHeartbeats 2000000; the identical tactic script split into sixteen
      separate declarations elaborates the whole set in under fifteen seconds at DEFAULT heartbeats.
      Separately measured: raising maxHeartbeats made the 64-goal Christoffel table SLOWER (17.7 s
      at the default 200000 against 34.7 s with a bump), because the limit changes elaborator search
      depth -- a heartbeat bump is not a free action and should be measured before it is applied.
      (3) A first | exact ... alternation can commit on a branch that has not actually been solved,
      because exact may succeed while postponing metavariable elaboration; the alternation then takes
      a branch whose goal is still open. Force elaboration, or keep the exact outside the alternation.
      (4) The general Ricci symmetry lemma ricci_symm (R_bd = R_db) was attempted and deliberately
      abandoned: it reduces to Clairaut''s theorem for the library''s one-variable coordinate partial
      derivative, Mathlib supplies second_derivative_symmetric only for fderiv, and transporting it
      through pderiv is a genuine piece of work. It is recorded in the Challenge, in the Solution
      docstring, in the library README and in this metadata as NOT PROVED and NOT COMPARED; symmetry
      is exhibited componentwise for each metric instead. (5) The nonvanishing-curvature theorems
      were added specifically as falsifiers for the definitions, not as additional results: a Ricci
      definition that was accidentally identically zero would still have proved every vacuum theorem
      in this entry, so static de Sitter (R = 12/L^2), Reissner-Nordstrom (R_theta theta = Q^2/r^2)
      and Kiselev (R_theta theta = -3wc r^{-(3w+1)}) are what exclude that, and the sign of the de
      Sitter scalar additionally pins the overall sign of the curvature convention. (6) The Vaidya
      module''s C^1 hypothesis is a finding, not a convenience. Enumerating the full v-derivative
      table of the Christoffel symbols before writing any Lean showed that exactly one entry contains
      m'''' -- the vv-component of the r-row -- and that the Ricci contraction never reaches it, because
      it requests only the a = v row and the trace. Implementing a full v-derivative table, which
      is what the static-spherical module does for the r-direction and therefore the obvious thing
      to do, would have introduced an m_2 atom and a twice-differentiability hypothesis, silently
      weakening the theorem. The split into a row lemma and a trace lemma is the fix, and it matters
      because the physically interesting Vaidya gluings have m of class C^1 but not C^2. (7) An oracle-side
      trap, recorded because the whole cross-check method rests on the oracle: sympy.simplify FAILED
      to reduce a Riemann component of FLAT space to zero. Checking Minkowski in spherical coordinates,
      the component R^r_{phi phi theta} came back as r*(sin(2 theta) tan(theta) + cos(2 theta) - 1)/(2
      tan(theta)), which is identically zero but which simplify leaves alone; trigsimp(expand_trig(.))
      reduces it. So a nonzero-looking oracle component is not evidence of nonzero curvature, and
      the protocol has a false-positive mode: when the oracle reports a single stray nonzero component,
      re-simplify before believing it. Recorded separately as a near-miss on a frozen contract: a
      worker brief stated the Kiselev w = 1/3 degeneration as Reissner-Nordstrom with Q^2 = c; the
      correct identification is Q^2 = -c, and the worker reported the correction rather than proving
      the brief.'
  spend_usd: subscription-based
  notes: 'Roles, stated separately. Direction: the author, a general-relativity physicist who maintains
    a validation-gated computer-algebra suite for this programme, set the target statements and their
    scope, chose which solutions were worth certifying and which results to leave out, directed the
    work, supplied that suite as one of the two independent oracles against which every lemma statement
    was fixed before any Lean proof was attempted, and takes responsibility for the submission. Mathematical
    argument: classical. Schwarzschild (1916), Reissner (1916) and Nordstrom (1918), Kottler (1918),
    Jebsen (1921) and Birkhoff (1923), Friedmann (1922) and Lemaitre (1927), Vaidya (1951) and Kiselev
    (2003) are the mathematics being checked, and no step of it originates with this entry. What did
    not exist beforehand, and was developed by AI agents (Claude Code, claude-opus-5) under the author''s
    direction, is the Lean proof architecture and the computations themselves: the choice to define
    the coordinate partial derivative as a one-variable deriv along a coordinate line rather than
    a component of fderiv; the decision to compute the Ricci tensor of the general static spherically
    symmetric chart for an arbitrary lapse before specialising to any solution; the row-plus-trace
    split of the Vaidya v-derivative tables, which was an agent finding -- enumerating the full derivative
    table showed that the single entry containing m'''' is never reached by the Ricci contraction,
    so the theorem holds for a merely once-differentiable mass function, where the obvious full-table
    implementation would have silently required a twice-differentiable one; and the machine-closed
    transcription check for the 304-entry Vaidya tables, also an agent finding, in which a parser
    reads the Lean array literals back out of the source and symbolically diffs every entry against
    the oracle (304 compared, 0 mismatches) so that no human transcription step remains in the chain.
    Formalization: the same agents, against frozen lemma contracts. Verification: mechanical (Lean''s
    own elaborator and kernel, a per-declaration #print axioms audit, and Comparator with its second
    independent kernel at submission time), plus an independent re-verification pass by a separate
    agent (claude-fable-5) covering clean rebuild, axiom audit over all fifty-four compared declarations,
    a byte-identity check of every restated declaration against its library counterpart, and a scan
    of the library for sorry, native_decide and axiom declarations. Communication: the Challenge documentation,
    the library README and this metadata were drafted by agents and reviewed by the author before
    submission.'
fidelity:
  divergences: 'CHART-ONLY, NOT MANIFOLD-LEVEL. A metric here is a matrix-valued function on Fin n
    -> R, i.e. on an open subset of R^n, and curvature is defined by the literal index formulas on
    that chart. There is no atlas, no manifold, no vector bundle, no transition-function condition
    and no coordinate-independence theorem. Nothing in this entry asserts that the compared objects
    transform as tensors under a change of chart, and no compared statement is invariant in that sense.
    This is a genuine restriction relative to the textbook sources cited, all of which develop curvature
    on a manifold; it is stated here rather than absorbed. It is also the form in which junction-condition
    and thin-shell computations are actually carried out, which is why the scope was chosen.


    SIGNATURE AND CONVENTIONS. Signature (-,+,+,+), G = c = 1. Christoffel symbols Gamma^a_{bc} =
    (1/2) g^{ad}(d_b g_{dc} + d_c g_{db} - d_d g_{bc}); Riemann R^a_{bcd} = d_c Gamma^a_{db} - d_d
    Gamma^a_{cb} + Gamma^a_{ce} Gamma^e_{db} - Gamma^a_{de} Gamma^e_{cb}; Ricci R_{bd} = R^a_{bad},
    the contraction on the FIRST and THIRD slots; R = g^{bd} R_{bd}; G_{bd} = R_{bd} - (1/2) R g_{bd};
    Maxwell stress T_{mu nu} = (1/4 pi)(F_{mu a} F_nu{}^a - (1/4) g_{mu nu} F_{ab} F^{ab}) in Gaussian
    units. This is the Wald (3.1.30)/(3.2.3) and Carroll (3.27)/(3.66) convention, in which the round
    sphere and de Sitter space have POSITIVE scalar curvature. The opposite overall sign for the Riemann
    tensor is also current in the literature and is not the one used here; a reader comparing against
    a source in the other convention will see sign differences that are not errors. The convention
    is pinned in Lean from both sides: a constant metric gives vanishing Christoffel symbols and Riemann
    tensor and eta^{bd} eta_{bd} = 4 fixes the index placement, while the compared static de Sitter
    theorems exhibit R = +12/L^2, positive, which is de Sitter rather than anti-de Sitter and which
    would come out negative in the opposite convention.


    COORDINATE ORDER DIFFERS BY CHART, DELIBERATELY. For the static spherically symmetric solutions
    (Parts III, IV, V, VI, IX, X, XI) the coordinates are (t, r, theta, phi) = (x0, x1, x2, x3). For
    Vaidya (Part VII) they are (v, r, theta, phi), so x0 is the advanced time and the mass function
    is evaluated at x0. For FLRW (Part VIII) they are Cartesian comoving (t, x, y, z), so x1, x2,
    x3 are spatial. A reader diffing two Parts must not assume x1 is a radius everywhere.


    VAIDYA IS THE INGOING CHART, WITH THE SIGN OF THE CROSS TERM FIXED. Part VII uses ingoing Eddington-Finkelstein
    coordinates with g_{vr} = g_{rv} = +1, i.e. ds^2 = -(1 - 2m(v)/r) dv^2 + 2 dv dr + r^2 dOmega^2.
    The outgoing chart, with -2 du dr, is a different metric and is not treated; nothing is claimed
    about it. The mass function m is required only to be ONCE differentiable near v: the hypothesis
    is HasDerivAt m (m_1 s) s eventually in the neighbourhood filter, and no compared statement requests
    a second derivative of m. That is deliberate and is discussed under automation.prompting_notes.
    Vaidya is also the only compared metric that is neither static nor diagonal, and its inverse has
    g^{vv} = 0, which is why its scalar curvature vanishes without a computation.


    FLRW IS SPATIALLY FLAT ONLY. Part VIII is k = 0, in Cartesian comoving coordinates. The open and
    closed FLRW charts are not treated and nothing is claimed about them. The Friedmann equations
    are compared in EINSTEIN-TENSOR form, as statements about components of G for the stated metric.
    No fluid is defined; H^2 = 8 pi rho / 3 and the acceleration equation follow only after a perfect
    fluid is posited and coupled through G = 8 pi T, and that step is not formalized.


    WHAT "VACUUM" AND "SOURCED" MEAN, PER SOLUTION. Parts III, V, X and the w = 0 case of XI: exactly
    R_{mu nu} = 0, equivalently G_{mu nu} = 0, as an identity between real numbers at each point of
    the stated region. Parts IV and IX: exactly R_{mu nu} = Lambda g_{mu nu}, with Lambda = 3/L^2
    in Part IX; no cosmological-constant term in an action is asserted. Part VI: a stress-energy tensor
    IS defined -- the Maxwell tensor of the Coulomb field F = (Q/r^2) dt ^ dr -- and G_{mu nu} = 8
    pi T_{mu nu} is proved for it in all sixteen components. This is the Einstein half of the Einstein-Maxwell
    system; Maxwell''s own equations, div F = 0 and dF = 0, are NEITHER STATED NOR USED anywhere in
    this entry or in the supporting library, so "Reissner-Nordstrom solves Einstein-Maxwell" must
    be read as exactly the identity proved and no more. Parts VII and VIII: NO stress-energy tensor
    is defined at all. The statements compute R_{mu nu} and G_{mu nu} and exhibit their form; the
    words "null dust" and "perfect fluid" describe that form and are not formalized claims about matter.
    No energy condition appears anywhere in this entry.


    KISELEV. The exponent is a real number, so the radial profile uses Real.rpow and the whole Part
    is stated on r > 0. The two degenerations noted in the Challenge docstring -- w = 1/3 giving Reissner-Nordstrom
    with Q^2 = -c (note the sign, which runs opposite to the naive guess) and w = -1 giving Schwarzschild-de
    Sitter with Lambda = 3c -- are recorded in prose and are NOT compared theorems. No claim is made
    that quintessence with any equation of state is physical.


    MATRIX INVERSE AND JUNK VALUES. g^{ad} is Mathlib''s Matrix.inv, which is the true inverse exactly
    when the determinant is a unit and whose junk value at a singular matrix is 0. Every compared
    statement is made either under an explicit IsUnit hypothesis or on a region where nondegeneracy
    of the chart is part of the hypotheses, so no compared statement depends on that junk value. Likewise
    the coordinate partial derivative is Mathlib''s deriv of a one-variable section and is total,
    returning 0 off the differentiable locus; every compared statement supplies the differentiability
    it needs.


    RICCI SYMMETRY AND BIANCHI, NOT PROVED. Stated in full under status.scope, in the Challenge and
    in the Solution docstring. The library does not prove R_{bd} = R_{db} in general and does not
    prove either Bianchi identity; neither is compared, and no compared proof uses either. Symmetry
    is exhibited componentwise for each metric treated.


    UNIQUENESS, GAUGE-RESTRICTED. exists_mass_of_areal_vacuum is compared as the calculus core of
    the Jebsen-Birkhoff theorem in the areal-radius static spherically symmetric gauge, and is labelled
    as such in its docstring rather than advertised as that theorem. Staticity is assumed here and
    derived there. The link between R_{theta theta} and the ODE r f'' + f - 1 = 0 is proved in the
    supporting library but is not part of the compared statement, which is the ODE alone.


    ONE DISCREPANCY FOUND IN THE SUPPORTING LIBRARY, CORRECTED HERE. A docstring in the library''s
    de Sitter module describes the spherical chart of flat space as having "eleven nonvanishing Christoffel
    symbols". Enumerating the table gives NINE nonzero entries in the 64-entry table, six distinct
    up to the symmetry of the lower indices. The Challenge states nine; the discrepancy is in library
    prose only and affects no statement, no proof and no compared declaration.


    NO OTHER KNOWN DIVERGENCE.'
review:
  status: agent-reviewed
  reviewers:
  - Claude Code agents (clean rebuild, per-declaration axiom audit over all 54 compared declarations,
    source-level signature diff against the library, definitional rfl bridges, sorry/native_decide/axiom
    scan, re-grep of the Mathlib coverage claim with positive controls, item-by-item Crossref and
    OpenAlex verification of every cited source)
  notes: 'Reviewed internally, mechanically, on 2026-08-27. The supporting library was rebuilt from
    scratch against Mathlib v4.32.0 (8,673 build jobs, clean, no warnings). A scan of the library
    for sorry, sorryAx, native_decide, ofReduceBool, axiom and opaque declarations found none. The
    Challenge was built and produces exactly twenty-one sorry warnings, one per compared theorem,
    and no other warning and no error. The Solution was built clean, with no warnings at all. Every
    one of the twenty-one compared theorems and every one of the thirty-three compared definitions
    was then checked with #print axioms in a separate file generated directly from comparator.json
    and compiled against the built artifacts; all fifty-four report exactly propext, Classical.choice
    and Quot.sound, and the audited set was checked to equal the comparator set exactly. A source-level
    diff then compared the signature of every one of those fifty-four declarations across three places
    -- the library module that proves it, the Solution restatement, and the Challenge statement --
    and found all fifty-four identical modulo the namespace. The thirty-three definitional bridges
    are compiled in the Solution as rfl in @-form, so implicit arguments are compared as well. The
    Mathlib zero-curvature claim was re-grepped this session at the pinned revision with positive
    controls (RiemannianMetric: 40 hit lines; deriv: 12,323) to confirm the grep was actually running,
    and the structure of RiemannianMetric was read directly to confirm that its pos field is literal
    positive-definiteness. Bibliographic records were verified item by item against the Crossref and
    OpenAlex APIs, and the records that disagree with the standard citation are flagged individually
    in the source notes rather than silently corrected. No human expert other than the author has
    reviewed the formalization.'
alignment:
  namespace: SchwarzschildVacuum
  statements:
  - source: Standard textbook general relativity (Wald 1984, ch. 3; MTW 1973; Carroll 2019, ch. 3),
      the general identity relating the two forms of the vacuum field equations
    lean: SchwarzschildVacuum.einstein_eq_zero_iff_ricciFlat
    module: Challenge
    status: proved
    note: 'For a chart-level metric that is pointwise symmetric and whose determinant is a unit at
      x, and for dimension n with (n : R) != 2, the Einstein tensor vanishes at x in every component
      if and only if the Ricci tensor does. n = 2 is genuinely excluded and the hypothesis is carried,
      not decorative: in two dimensions the Einstein tensor vanishes identically for every metric.
      The proof contracts the Einstein tensor with the inverse metric to get (1 - n/2) R = 0.'
  - source: Schwarzschild (Sitzungsber. Preuss. Akad. Wiss. Berlin, 1916, 189-196)
    lean: SchwarzschildVacuum.schwarzschild_ricciFlat
    module: Challenge
    status: proved
    note: Every component of the Ricci tensor of diag(-(1 - 2M/r), (1 - 2M/r)^{-1}, r^2, r^2 sin^2
      theta) vanishes at every point of {0 < r, 2M < r, sin(theta) != 0}. The region is an open subset
      of R^4 and the statement is chart-local; nothing is claimed at the horizon, in the interior,
      at r <= 0, at the coordinate poles, or in any extension.
  - source: Schwarzschild (1916), the field equations in Einstein-tensor form
    lean: SchwarzschildVacuum.schwarzschild_einstein_eq_zero
    module: Challenge
    status: proved
    note: G_{mu nu} = 0 on the same exterior chart, obtained from Ricci-flatness through the compared
      equivalence theorem at n = 4 rather than by a second independent computation.
  - source: Schwarzschild (1916); the vanishing of the Ricci scalar is an immediate consequence of
      Ricci-flatness
    lean: SchwarzschildVacuum.schwarzschild_scalarCurvature_eq_zero
    module: Challenge
    status: proved
    note: 'R = 0 on the exterior chart. This is NOT a flatness statement and must not be read as one:
      the Kretschmann scalar of Schwarzschild is 48 M^2 / r^6, nonzero, and it is not formalized in
      this entry.'
  - source: Kottler (Ann. Phys. 361 (1918), 401-462), the Schwarzschild-de Sitter solution
    lean: SchwarzschildVacuum.ricci_sds
    module: Challenge
    status: proved
    note: R_{mu nu} = Lambda g_{mu nu} for the static spherically symmetric metric with lapse f =
      1 - 2M/r - Lambda r^2/3. The neighbourhood hypotheses (the lapse and the radius nonzero NEAR
      r, written with Mathlib's eventually-in-the-neighbourhood-filter) are what differentiating the
      metric requires and are not removable.
  - source: Jebsen (Ark. Mat. Ast. Fys. 15 (1921), no. 18; GRG 37 (2005) 2253-2259) and Birkhoff (Relativity
      and Modern Physics, Harvard Univ. Press, 1923); RESTRICTED to the areal-radius static spherically
      symmetric gauge
    lean: SchwarzschildVacuum.exists_mass_of_areal_vacuum
    module: Challenge
    status: proved
    note: 'On an open interval (a,b) avoiding r = 0, every lapse f with derivative f_1 satisfying
      1 - f - r f_1 = 0 throughout equals 1 - 2M/r for a single constant M. This is STRICTLY WEAKER
      than Jebsen''s and Birkhoff''s theorem and is labelled as such: staticity, spherical symmetry,
      the areal radial coordinate and the reciprocal lapse/radial-metric pair are ASSUMED here, whereas
      the genuine theorem derives staticity from the vacuum equations for a general, possibly time-dependent,
      spherically symmetric metric. The compared statement is the ODE alone; the fact that R_{theta
      theta} = 1 - f - r f'' for this chart is proved in the supporting library but is not part of
      the statement.'
  - source: Reissner (Ann. Phys. 355 (1916), 106-120) and Nordstrom (KNAW Proc. 20 (1918), 1238-1245)
    lean: SchwarzschildVacuum.ricci_rn_thetaTheta
    module: Challenge
    status: proved
    note: 'R_{theta theta} = Q^2 / r^2 for the Reissner-Nordstrom metric on {r > 0, f != 0, sin(theta)
      != 0}. NONZERO whenever the charge is, which is the point: it is the falsifier for the Schwarzschild
      statements, and it shows the curvature definitions are not accidentally identically zero.'
  - source: Reissner (1916) and Nordstrom (1918); tracelessness of the electromagnetic stress tensor
      in four dimensions
    lean: SchwarzschildVacuum.reissnerNordstrom_scalarCurvature_eq_zero
    module: Challenge
    status: proved
    note: 'R = 0 for Reissner-Nordstrom on the same region. Not a vacuum statement: the Ricci tensor
      is nonzero (see the previous entry) and only its trace vanishes.'
  - source: 'Jackson / Wald (6.5.2): the invariant of a purely radial electric field'
    lean: SchwarzschildVacuum.faradayInvariant_coulomb
    module: Challenge
    status: proved
    note: F_{ab} F^{ab} = -(2 Q^2 / r^4) for the Coulomb Faraday tensor F = (Q/r^2) dt ^ dr, with
      both indices raised by the inverse Reissner-Nordstrom metric. Negative, as it must be for a
      purely electric field.
  - source: Reissner (1916) and Nordstrom (1918); the Einstein-Maxwell system, with the stress tensor
      as in MTW (5.6) and Wald (6.5.4)
    lean: SchwarzschildVacuum.reissnerNordstrom_einstein_eq_maxwell
    module: Challenge
    status: proved
    note: 'G_{mu nu} = 8 pi T_{mu nu} in all sixteen components on {r > 0, f != 0, sin(theta) != 0},
      where T is the Maxwell stress-energy tensor of the Coulomb field as DEFINED in the Challenge
      and every index is raised with the inverse metric. Both sides are built from compared definitions.
      This is the Einstein half of the Einstein-Maxwell system only: Maxwell''s equations, div F =
      0 and dF = 0, are neither stated nor used anywhere.'
  - source: Vaidya (Proc. Indian Acad. Sci. A 33 (1951); GRG 31 (1999) 121-135); statement in the
      form of Poisson, A Relativist's Toolkit (2004), eq. (4.35)
    lean: SchwarzschildVacuum.ricci_vaidya_null_dust
    module: Challenge
    status: proved
    note: R_{mu nu} = (2 m'(v) / r^2) delta^v_mu delta^v_nu for the INGOING Eddington-Finkelstein
      Vaidya metric, in all sixteen components, for an arbitrary mass function differentiable near
      v. The hypothesis is first-derivative-only and no compared statement requests m''; that is deliberate,
      because the physically interesting gluings have m of class C^1 but not C^2. This is the only
      compared metric that is neither static nor diagonal.
  - source: Vaidya (1951); the trace of a null Ricci tensor
    lean: SchwarzschildVacuum.vaidya_scalarCurvature_eq_zero
    module: Challenge
    status: proved
    note: 'R = 0 for the ingoing Vaidya metric. Not a cancellation: the only nonvanishing Ricci component
      is R_{vv} and the ingoing inverse metric has g^{vv} = 0, so the trace vanishes because the Ricci
      tensor is null.'
  - source: Vaidya (1951); the field equations in Einstein-tensor form
    lean: SchwarzschildVacuum.einstein_vaidya
    module: Challenge
    status: proved
    note: 'G_{mu nu} equals the same rank-one null table, since R = 0. Stated against a compared definition
      (the Vaidya Ricci table) rather than re-expanded. NO stress-energy tensor is defined: ''null
      dust'' describes the form of the computed curvature and is not a formalized claim about matter.'
  - source: Friedmann (Z. Phys. 10 (1922) 377-386) and Lemaitre (Ann. Soc. Sci. Bruxelles A47 (1927)
      49-59; MNRAS 91 (1931) 483-490); expression as in Carroll (2019), eq. (8.67)
    lean: SchwarzschildVacuum.friedmann_first
    module: Challenge
    status: proved
    note: 'G_tt = 3 (adot/a)^2 for spatially flat FLRW in Cartesian comoving coordinates, wherever
      the scale factor is nonzero and twice differentiable near t. Compared in EINSTEIN-TENSOR form:
      no fluid is defined, and H^2 = 8 pi rho / 3 follows only after one is posited and coupled through
      G = 8 pi T, which is not formalized. Spatially flat (k = 0) only.'
  - source: Friedmann (1922) and Lemaitre (1927); expression as in Carroll (2019), eq. (8.68)
    lean: SchwarzschildVacuum.friedmann_second
    module: Challenge
    status: proved
    note: G_ii = -(2 a addot + adot^2) for each of the three spatial directions, same hypotheses and
      same caveats as the first equation. The index hypothesis i != 0 is carried explicitly.
  - source: Friedmann (1922) and Lemaitre (1927); isotropy of the flat FLRW source
    lean: SchwarzschildVacuum.einstein_flrw_offDiag
    module: Challenge
    status: proved
    note: Every off-diagonal component of the Einstein tensor of flat FLRW vanishes -- no momentum
      flux and no anisotropic stress -- which is what makes the two Friedmann equations the whole
      content of the field equations for this metric.
  - source: de Sitter space in the static patch; standard textbook result (Hawking and Ellis section
      5.2; Carroll 2019)
    lean: SchwarzschildVacuum.ricci_deSitterStatic
    module: Challenge
    status: proved
    note: 'R_{mu nu} = (3/L^2) g_{mu nu} on {r > 0, f != 0, sin(theta) != 0} for L != 0: the static
      patch is an Einstein space with Lambda = 3/L^2. The cosmological horizon r = L is excluded,
      since the chart degenerates there.'
  - source: de Sitter space; the scalar curvature of a maximally symmetric four-space
    lean: SchwarzschildVacuum.deSitterStatic_scalarCurvature
    module: Challenge
    status: proved
    note: 'R = 12/L^2, constant and POSITIVE. This is the sharpest single check that the sign convention
      fixed in the Challenge is the one advertised: in the opposite overall convention this number
      is negative, and de Sitter would be indistinguishable from anti-de Sitter by this statement.'
  - source: Elementary; Minkowski space in spherical coordinates
    lean: SchwarzschildVacuum.minkowskiSpherical_ricciFlat
    module: Challenge
    status: proved
    note: 'Ricci-flat wherever r != 0 and sin(theta) != 0. Compared deliberately despite being elementary:
      the areal-radius chart of FLAT space has nine nonvanishing entries in its 64-entry Christoffel
      table, so this tests that the Riemann and Ricci definitions produce zero by CANCELLATION among
      nonzero connection coefficients rather than from an empty table -- which is exactly the failure
      mode a curvature definition could have while still proving every vacuum theorem in this entry.'
  - source: Kiselev (Class. Quantum Grav. 20 (2003) 1187-1197)
    lean: SchwarzschildVacuum.ricci_kiselev_thetaTheta
    module: Challenge
    status: proved
    note: R_{theta theta} = -(3 w c r^{-(3w+1)}) for the quintessence lapse on r > 0 with the lapse
      nonzero near r. Nonzero whenever w and c are, so this is a third nonvanishing-curvature control.
      The exponent is a REAL power (Real.rpow). The degenerations at w = 1/3 (Reissner-Nordstrom with
      Q^2 = -c, note the sign) and w = -1 (Schwarzschild-de Sitter with Lambda = 3c) are recorded
      in the docstring and are NOT compared.
  - source: Kiselev (2003); the dust case
    lean: SchwarzschildVacuum.kiselev_ricciFlat_of_w_eq_zero
    module: Challenge
    status: proved
    note: At w = 0 the Kiselev metric is Ricci-flat, because f = 1 - 2M/r - c/r is Schwarzschild with
      mass M + c/2 and the c/r term is a pure mass shift carrying no curvature of its own.

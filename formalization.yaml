version: v0.4
project:
  name: Exact solutions of the vacuum and sourced Einstein field equations, verified in coordinates
  description: 'This project machine-checks in Lean 4, against Mathlib v4.32.0, that the standard
    exact solutions of the Einstein field equations do satisfy those equations, computed at the level
    of coordinate components on a chart. Twenty-one theorems and thirty-three definitions are compared;
    the compared set is exactly what the Challenge states and comparator.json names, and the supporting
    library contains further results deliberately not advertised here.


    WHAT IS COMPARED, BY SOLUTION. (III) SCHWARZSCHILD on the exterior chart r > 2M > 0 away from
    the coordinate poles: R_{mu nu} = 0, G_{mu nu} = 0, R = 0. (IV) SCHWARZSCHILD-DE SITTER (Kottler),
    f = 1 - 2M/r - Lambda r^2/3: R_{mu nu} = Lambda g_{mu nu}. (V) UNIQUENESS in the areal-radius
    static spherically symmetric gauge: on an interval avoiding r = 0 the only lapses solving R_{theta
    theta} = 0 are f = 1 - 2M/r. (VI) REISSNER-NORDSTROM, f = 1 - 2M/r + Q^2/r^2, with the Maxwell
    sector: the Faraday tensor of the Coulomb field F = (Q/r^2) dt ^ dr and the Maxwell stress tensor
    T_{mu nu} = (1/4pi)(F_{mu a}F_nu{}^a - (1/4) g_{mu nu} F_{ab}F^{ab}) are both DEFINED, and G_{mu
    nu} = 8 pi T_{mu nu} is proved in all sixteen components -- the Einstein half of the Einstein-Maxwell
    system; also F_{ab}F^{ab} = -2Q^2/r^4, R = 0, and R_{theta theta} = Q^2/r^2, nonzero, the falsifier
    for the Schwarzschild statements. (VII) INGOING VAIDYA, ds^2 = -(1-2m(v)/r)dv^2 + 2 dv dr + r^2
    dOmega^2, neither static nor diagonal: R_{mu nu} = (2 m''(v)/r^2) delta^v_mu delta^v_nu, rank-one
    null dust, for an arbitrary ONCE-differentiable mass function; R = 0; and the Einstein-tensor
    form. (VIII) SPATIALLY FLAT FLRW: both Friedmann equations in Einstein-tensor form, G_tt = 3(adot/a)^2
    and G_ii = -(2 a addot + adot^2), plus vanishing off-diagonal G. (IX) STATIC DE SITTER, f = 1
    - r^2/L^2: R_{mu nu} = (3/L^2) g_{mu nu} and R = 12/L^2. (X) MINKOWSKI IN SPHERICAL COORDINATES:
    Ricci-flat. (XI) KISELEV, f = 1 - 2M/r - c r^{-(3w+1)} with a real exponent: R_{theta theta} =
    -3wc r^{-(3w+1)}, nonzero for w != 0, and Ricci-flat at w = 0. Part II compares the general fact
    that licenses calling several of these the same thing: for a symmetric chart-level metric with
    invertible determinant in dimension n != 2, G vanishes iff Ricci does. Every compared statement,
    with its exact hypotheses and its scope caveats, is listed one by one under alignment.


    WHY THIS ENTRY EXISTS. The compared statements are classical -- Schwarzschild (1916), Reissner
    (1916) and Nordstrom (1918), Kottler (1918), Jebsen (1921) and Birkhoff (1923), Friedmann (1922)
    and Lemaitre (1927), Vaidya (1951), Kiselev (2003). NO NEW MATHEMATICS IS CLAIMED HERE, and none
    should be read into this entry. The purpose is a proof of concept, stated as such: to certify
    that the supporting library''s coordinate-level definitions -- the coordinate partial derivative,
    the Christoffel symbols, the Riemann and Ricci tensors, the scalar curvature, the Einstein tensor
    and the Maxwell sector, in the sign and index conventions the Challenge fixes explicitly -- together
    with its computational method (explicit component calculation with the lapse or mass or scale
    factor carried as symbolic atoms, cross-checked before any Lean proof against two independent
    symbolic engines, one of them the author''s validation-gated computer-algebra suite) reproduce
    the textbook results on solutions whose answers are already known. Lean checks that a proof establishes
    a statement, not that a definition means what its name says, so a sign, index or contraction convention
    can be wrong in a way type-checking never detects. Crucially, several compared answers are NONZERO  --
    de Sitter''s R = 12/L^2, Reissner-Nordstrom''s R_{theta theta} = Q^2/r^2, Vaidya''s R_{vv} = 2m''(v)/r^2,
    Kiselev''s R_{theta theta} = -3wc r^{-(3w+1)} -- because a curvature definition that was accidentally
    identically zero would still have proved every vacuum theorem here, and only the nonvanishing
    ones exclude that. Minkowski in spherical coordinates is included for the mirror-image reason:
    that chart of FLAT space still has nine nonvanishing entries in its 64-entry Christoffel table,
    so getting zero there tests cancellation rather than emptiness. Later work in this programme --
    junction conditions, thin shells, further sourced solutions -- is intended to be stated against
    these same definitions, which a reader can then trust because they were certified here first.


    MATHLIB HAS NO CURVATURE. Grepped case-insensitively across all 8,264 .lean files of Mathlib at
    revision 81a5d257c8e410db227a6665ed08f64fea08e997 (tag v4.32.0), checked for this entry with positive
    controls to confirm the grep was running: christoffel, leviCivita, levi_civita, riemannCurvature,
    curvatureTensor, ricci, scalarCurvature, sectionalCurvature, Lorentzian and PseudoRiemannian each
    return zero hits. The one metric structure Mathlib does have, RiemannianMetric in Mathlib/Topology/VectorBundle/Riemannian.lean,
    carries literal positive-definiteness in its pos field and therefore cannot express signature
    (-,+,+,+); Mathlib/Geometry/Manifold/Riemannian/ contains exactly two files, Basic.lean and PathELength.lean,
    and the CovariantDerivative directory supplies a connection layer with no curvature and no Levi-Civita
    existence or uniqueness theorem. The Challenge therefore defines the entire chain inline from
    Mathlib primitives only -- deriv, Function.update, Finset.sum, Matrix.diagonal, Matrix.of, Matrix.inv,
    Real.sin, Real.pi, Real.rpow, HasDerivAt, nhds -- with no structures, no typeclasses and no Prop-valued
    bundling. Each of the thirty-three definitions carries a docstring giving its ordinary mathematical
    meaning and the textbook equation it implements, and the Solution restates every one of them verbatim
    with a definitional-equality bridge to the library.


    SCOPE, STATED PLAINLY. Everything is a computation in one fixed coordinate chart, an open subset
    of R^4. There is no atlas, no manifold, no vector bundle, no coordinate-independence theorem,
    and no claim that the objects defined here transform tensorially. There is no global or maximal
    extension: horizons and coordinate poles lie outside every compared statement. The uniqueness
    theorem is NOT Birkhoff''s theorem: staticity, spherical symmetry and the areal gauge are assumed
    there, whereas the genuine theorem derives staticity from the vacuum equations for a general,
    possibly time-dependent, spherically symmetric metric. "Vacuum" and "sourced" mean exactly what
    each statement says, and the meaning differs by Part: for III, V, X and w = 0 of XI, exactly R_{mu
    nu} = 0; for IV and IX, exactly R_{mu nu} = Lambda g_{mu nu}; for VI a stress-energy tensor IS
    defined and G = 8 pi T is proved for it, but Maxwell''s own equations are NEITHER STATED NOR USED;
    for VII and VIII NO stress-energy tensor is defined at all, so "null dust" and "perfect fluid"
    describe the form of the computed curvature and are not formalized claims about matter. No energy
    condition appears anywhere. Vaidya is the INGOING Eddington-Finkelstein chart with g_{vr} = +1;
    FLRW is spatially flat (k = 0) only; Kiselev uses Real.rpow and is stated on r > 0. Nothing here
    is numerical or asymptotic. Every one of these restrictions is set out in full under fidelity.


    ONE LIBRARY LIMITATION, PRE-STATED. The supporting library does NOT prove the symmetry of the
    Ricci tensor, R_{bd} = R_{db}, in general: that reduces to Clairaut''s theorem for the library''s
    coordinate partial derivative, Mathlib supplies it only for fderiv, and transporting it was deliberately
    scoped out. No general symmetry lemma is compared and none is used in any compared proof; for
    every metric treated, symmetry is instead EXHIBITED, all sixteen Ricci components being computed
    and the off-diagonal ones shown to vanish. The Bianchi identities are absent for the same reason
    and are likewise not compared.


    AUDIENCE. First, the general-relativity community. Checking the field equations on the standard
    exact solutions in a kernel-checked proof assistant is the baseline any formal result about spacetime
    geometry must clear, and until this library there was no Lean vocabulary in which a general-relativity
    statement could be written at all. The definitional layer certified here is the one a junction-condition
    or thin-shell statement would be written against -- computations the field currently certifies
    with computer algebra alone. The Vaidya result is the sharpest case: its mass function need only
    be C^1, exactly the regularity available when gluing across a radiating shell. Second, the formalization
    community. Because Mathlib has no curvature of any kind, this entry is coverage-creating rather
    than coverage-duplicating: it puts the connection coefficients, the Riemann and Ricci tensors,
    the scalar curvature, the Einstein tensor and the Maxwell stress tensor into Lean in indefinite
    signature, on static, non-static, diagonal and non-diagonal charts, and the library proves the
    Christoffel table and the Ricci tensor of the general static spherically symmetric chart for an
    ARBITRARY lapse, so any spherical lapse instantiates the same theorem.


    PROVENANCE AND NOVELTY. The compared results are classical and are formalized here from their
    standard statements, not translated from any one proof; the relationship recorded for each classical
    source is therefore independently-proves. No claim of mathematical novelty is made anywhere in
    this entry. What is asserted, and checked, is that Mathlib contains no curvature content (grepped,
    above). A targeted search for prior proof-assistant formalizations of curvature in indefinite
    signature, of the Einstein field equations, or of the Schwarzschild, Reissner-Nordstrom, Vaidya
    or FLRW solutions -- across Lean, Isabelle/HOL and the AFP, Coq/Rocq, HOL Light, Mizar and Metamath
    -- found none; the nearest neighbours are recorded under related formalizations. That search was
    targeted, not exhaustive, and absence from search is not proof that no prior formalization exists.'
